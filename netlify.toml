[build]
  command = "npm run setup && npm run build"
  publish = "client/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/api/likes"
  to = "/.netlify/functions/likes"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/notes/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
